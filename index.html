<script>/* ===== Núcleo: datos, cálculo y exportadores ===== */
const HEADER_TXT = 'Evaluación Entrega 3 - Facultad de Ingeniería - Universidad de La Sabana - Experiencia Centrada en el Diseño, profesor: Yosimar Díaz Monterroza';
const PROFESOR = 'Yosimar Díaz Monterroza';
const BLUE = '12356E';
const COMP_NAMES = { pres: 'Presentación final', trab: 'Trabajo escrito (one-pager en inglés)' };

const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Calcula la retroalimentación consolidada de un grupo a partir de las evaluaciones de los jurados */
const DAYS = { mie: 'Miércoles', vie: 'Viernes' };
function calcFeedback(group, evals, day) {
  day = day || 'mie';
  const jurors = [1, 2, 3].map(k => evals[day + '_g' + group + '_j' + k]).filter(Boolean)
    .filter(e => Object.keys(e.pres || {}).length + Object.keys(e.trab || {}).length > 0);
  const comps = [];
  for (const key of ['pres', 'trab']) {
    const rows = RUBRIC[key].map((c, i) => {
      const lv = [], obs = [];
      jurors.forEach(e => {
        const v = Number((e[key] || {})[i]);
        if (v >= 1 && v <= 4) lv.push(v);
        const t = ((e.obs || {})[key[0] + i] || '').trim();
        if (t) obs.push((jurors.length > 1 ? 'Jurado ' + e.jurado + ': ' : '') + t);
      });
      const avg = lv.length ? lv.reduce((a, b) => a + b, 0) / lv.length : null;
      const pct = avg == null ? null : avg / 4 * 100;
      const near = avg == null ? null : Math.min(4, Math.max(1, Math.round(avg)));
      return { n: i + 1, t: c.t, w: c.w, avg, pct, obs, desc: near ? c.l[4 - near] : '', near };
    });
    const rated = rows.filter(r => r.pct != null);
    const wsum = rated.reduce((a, r) => a + r.w, 0);
    const score = wsum ? rated.reduce((a, r) => a + r.pct * r.w, 0) / wsum : null;
    comps.push({ key, name: COMP_NAMES[key], rows, score, complete: rated.length === rows.length, any: rated.length > 0 });
  }
  const withData = comps.filter(c => c.score != null);
  const global = withData.length ? withData.reduce((a, c) => a + c.score, 0) / withData.length : null;
  const general = jurors.filter(e => (e.general || '').trim()).map(e => (jurors.length > 1 ? 'Jurado ' + e.jurado + ': ' : '') + e.general.trim());
  return { group, day, dayName: DAYS[day], title: 'Retroalimentación - Grupo ' + group + ' - ' + DAYS[day], n: jurors.length, comps, global, general };
}

const obsText = r => r.obs.length ? r.obs : (r.desc ? ['Nivel ' + r.near + ': ' + r.desc] : ['—']);

/* ---------- Vista previa HTML (hoja carta) ---------- */
function previewHTML(fb, logo) {
  const head = `<div class="ph">${logo ? `<img src="${logo}" alt="Escudo">` : ''}<div class="pht">${esc(HEADER_TXT)}</div></div>`;
  if (!fb.n) return `<div class="paper">${head}<h2>${esc(fb.title)}</h2><p class="empty">Aún no hay evaluaciones registradas para este grupo.</p></div>`;
  const info = `<table class="g info"><tr><th>Grupo</th><td>${fb.group} – ${fb.dayName}</td></tr><tr><th>Profesor</th><td>${esc(PROFESOR)}</td></tr><tr><th>Evaluaciones registradas</th><td>${fb.n}</td></tr><tr><th>Calificación global</th><td>${fb.global == null ? '—' : Math.round(fb.global) + ' / 100'} ${fb.global == null ? '' : '<span class="muted">(' + fmt1(fb.global / 20) + ' / 5,0)</span>'}</td></tr></table>`;
  const tabs = fb.comps.filter(c => c.any).map(c => `<h3>${esc(c.name)} — ${Math.round(c.score)} / 100${c.complete ? '' : ' <span class="muted">(parcial)</span>'}</h3>
  <table class="g res"><thead><tr><th>Criterio</th><th>Peso</th><th>Nivel</th><th>Calificación</th><th>Observaciones</th></tr></thead><tbody>
  ${c.rows.filter(r => r.pct != null).map(r => `<tr><td>${esc(r.t)}</td><td>${r.w}%</td><td>${fmt1(r.avg)}</td><td>${Math.round(r.pct)} / 100</td><td>${obsText(r).map(esc).join('<br>')}</td></tr>`).join('')}
  </tbody></table>`).join('');
  const gen = fb.general.length ? `<h3>Comentarios generales</h3>${fb.general.map(t => `<p>${esc(t)}</p>`).join('')}` : '';
  return `<div class="paper">${head}<h2>${esc(fb.title)}</h2>${info}${tabs}${gen}<div class="pf">Grupo ${fb.group} – ${fb.dayName} – Yosimar Díaz – Página 1</div></div>`;
}

/* ---------- Escudo: recolorear a azul ---------- */
function tintLogo(dataUrl, recolor, maxH) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, (maxH || 320) / img.height);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      if (recolor) {
        const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
        const R = parseInt(BLUE.slice(0, 2), 16), G = parseInt(BLUE.slice(2, 4), 16), B = parseInt(BLUE.slice(4), 16);
        for (let i = 0; i < p.length; i += 4) {
          const lum = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) / 255;
          const a = Math.min(1, (p[i + 3] / 255) * (1 - lum) * 1.25);
          p[i] = R; p[i + 1] = G; p[i + 2] = B; p[i + 3] = Math.round(a * 255);
        }
        x.putImageData(d, 0, 0);
      }
      res({ dataUrl: c.toDataURL('image/png'), w: c.width, h: c.height });
    };
    img.onerror = () => rej(new Error('imagen'));
    img.src = dataUrl;
  });
}
const dataUrlToBytes = u => { const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
const pngSize = u => { const a = dataUrlToBytes(u); const dv = new DataView(a.buffer); return { w: dv.getUint32(16), h: dv.getUint32(20) }; };

/* ---------- Word (.docx) ---------- */
function buildDocx(D, fb, logo) {
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, ImageRun, Header, Footer, PageNumber, BorderStyle, ShadingType } = D;
  const line = { style: BorderStyle.SINGLE, size: 4, color: '000000' };
  const borders = { top: line, bottom: line, left: line, right: line };
  const none = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
  const nob = { top: none, bottom: none, left: none, right: none };
  const P = (t, o = {}) => new Paragraph({ spacing: { after: 40 }, alignment: o.align, children: [new TextRun({ text: t, bold: o.bold, size: o.size || 20, color: o.color, font: 'Arial' })] });
  const cell = (paras, w, o = {}) => new TableCell({ borders, width: { size: w, type: WidthType.DXA }, margins: { top: 60, bottom: 60, left: 100, right: 100 }, shading: o.fill ? { type: ShadingType.CLEAR, fill: o.fill, color: 'auto' } : undefined, children: paras });
  const hcell = (t, w) => cell([P(t, { bold: true })], w, { fill: 'E8EEF7' });

  /* encabezado */
  const hdrChildren = [];
  if (logo) { const s = pngSize(logo), h = 46, w = Math.round(h * s.w / s.h); hdrChildren.push(new Paragraph({ spacing: { after: 60 }, children: [new ImageRun({ data: dataUrlToBytes(logo), transformation: { width: w, height: h } })] })); }
  hdrChildren.push(new Paragraph({ border: { bottom: { style: BorderStyle.SINGLE, size: 8, color: BLUE, space: 4 } }, children: [new TextRun({ text: HEADER_TXT, bold: true, size: 17, color: BLUE, font: 'Arial' })] }));

  const kids = [];
  kids.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 120, after: 200 }, children: [new TextRun({ text: fb.title, bold: true, size: 28, font: 'Arial' })] }));
  if (!fb.n) kids.push(P('Aún no hay evaluaciones registradas para este grupo.'));
  else {
    const iw = [2800, 6560];
    const irow = (a, b) => new TableRow({ children: [cell([P(a, { bold: true })], iw[0]), cell([P(b)], iw[1])] });
    kids.push(new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: iw, rows: [
      irow('Grupo', fb.group + ' – ' + fb.dayName), irow('Profesor', PROFESOR), irow('Evaluaciones registradas', String(fb.n)),
      irow('Calificación global', fb.global == null ? '—' : Math.round(fb.global) + ' / 100  (' + fmt1(fb.global / 20) + ' / 5,0)')] }));
    const cw = [2300, 800, 900, 1360, 4000];
    for (const c of fb.comps.filter(c => c.any)) {
      kids.push(new Paragraph({ spacing: { before: 280, after: 100 }, children: [new TextRun({ text: c.name + ' — ' + Math.round(c.score) + ' / 100' + (c.complete ? '' : ' (parcial)'), bold: true, size: 22, font: 'Arial' })] }));
      kids.push(new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: cw, rows: [
        new TableRow({ tableHeader: true, children: ['Criterio', 'Peso', 'Nivel', 'Calificación', 'Observaciones'].map((t, i) => hcell(t, cw[i])) }),
        ...c.rows.filter(r => r.pct != null).map(r => new TableRow({ cantSplit: true, children: [
          cell([P(r.t)], cw[0]), cell([P(r.w + '%')], cw[1]), cell([P(fmt1(r.avg))], cw[2]), cell([P(Math.round(r.pct) + ' / 100')], cw[3]),
          cell(obsText(r).map(t => P(t)), cw[4])] }))] }));
    }
    if (fb.general.length) {
      kids.push(new Paragraph({ spacing: { before: 280, after: 100 }, children: [new TextRun({ text: 'Comentarios generales', bold: true, size: 22, font: 'Arial' })] }));
      fb.general.forEach(t => kids.push(P(t)));
    }
  }
  return new Document({
    creator: 'Yosimar Díaz Monterroza', title: fb.title,
    sections: [{
      properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 2200, bottom: 1200, left: 1440, right: 1440, header: 450 } } },
      headers: { default: new Header({ children: hdrChildren }) },
      footers: { default: new Footer({ children: [new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: 'Grupo ' + fb.group + ' – ' + fb.dayName + ' – Yosimar Díaz – Página ', size: 16, font: 'Arial' }), new TextRun({ children: [PageNumber.CURRENT], size: 16, font: 'Arial' })] })] }) },
      children: kids
    }]
  });
}

/* ---------- PDF ---------- */
function buildPdf(J, fb, logo) {
  const doc = new J.jsPDF({ unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 56;
  const rgb = [0x12, 0x35, 0x6E];
  const header = () => {
    if (logo) { const s = pngSize(logo), h = 36, w = h * s.w / s.h; doc.addImage(logo, 'PNG', M, 22, w, h); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...rgb);
    doc.text(doc.splitTextToSize(HEADER_TXT, W - 2 * M), M, logo ? 74 : 40);
    doc.setDrawColor(...rgb); doc.setLineWidth(0.8); doc.line(M, logo ? 96 : 62, W - M, logo ? 96 : 62);
    doc.setTextColor(0);
  };
  const drawn = new Set();
  const footer = () => { doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.text('Grupo ' + fb.group + ' – ' + fb.dayName + ' – Yosimar Díaz – Página ' + doc.internal.getNumberOfPages(), W / 2, H - 30, { align: 'center' }); };
  const common = { margin: { top: 110, left: M, right: M, bottom: 50 }, theme: 'grid', styles: { font: 'helvetica', fontSize: 9, cellPadding: 5, textColor: 0, lineColor: 0, lineWidth: 0.5, valign: 'top' }, headStyles: { fillColor: [232, 238, 247], textColor: 0, fontStyle: 'bold' }, didDrawPage: () => { const pg = doc.internal.getNumberOfPages(); if (!drawn.has(pg)) { drawn.add(pg); header(); footer(); } } };
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(0);
  doc.text(fb.title, W / 2, 126, { align: 'center' });
  let y = 140;
  if (!fb.n) { header(); footer(); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text('Aún no hay evaluaciones registradas para este grupo.', M, y + 10); return doc; }
  doc.autoTable({ ...common, startY: y, body: [['Grupo', fb.group + ' – ' + fb.dayName], ['Profesor', PROFESOR], ['Evaluaciones registradas', String(fb.n)], ['Calificación global', fb.global == null ? '—' : Math.round(fb.global) + ' / 100  (' + fmt1(fb.global / 20) + ' / 5,0)']], columnStyles: { 0: { fontStyle: 'bold', cellWidth: 150, fillColor: [232, 238, 247] } } });
  y = doc.lastAutoTable.finalY;
  for (const c of fb.comps.filter(c => c.any)) {
    if (y > H - 140) { doc.addPage(); y = 110; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text(c.name + ' — ' + Math.round(c.score) + ' / 100' + (c.complete ? '' : ' (parcial)'), M, y + 24);
    doc.autoTable({ ...common, startY: y + 32, head: [['Criterio', 'Peso', 'Nivel', 'Calificación', 'Observaciones']],
      body: c.rows.filter(r => r.pct != null).map(r => [r.t, r.w + '%', fmt1(r.avg), Math.round(r.pct) + ' / 100', obsText(r).join('\n')]),
      columnStyles: { 0: { cellWidth: 105 }, 1: { cellWidth: 36 }, 2: { cellWidth: 36 }, 3: { cellWidth: 62 } } });
    y = doc.lastAutoTable.finalY;
  }
  if (fb.general.length) {
    if (y > H - 120) { doc.addPage(); y = 110; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Comentarios generales', M, y + 24);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    let yy = y + 40;
    fb.general.forEach(t => { doc.splitTextToSize(t, W - 2 * M).forEach(l => { if (yy > H - 60) { doc.addPage(); yy = 114; } doc.text(l, M, yy); yy += 12; }); yy += 4; });
  }
  return doc;
}

const evKey = (g, k, d) => (d || S.day) + '_g' + g + '_j' + k;
const dayChips = () => `<div class="lbl">Sesión</div><div class="chips">${Object.keys(DAYS).map(d => `<button class="chip ${S.day === d ? 'on' : ''}" data-day="${d}">Grupo ${DAYS[d]}</button>`).join('')}</div>`;

/* ---- arranque ---- */
async function init() {
  S.uid = lsGet('uid') || ('u' + Math.random().toString(36).slice(2, 12)); lsSet('uid', S.uid);
  try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { }
  if (!sb) { banner('No se pudo cargar Supabase (¿sin internet?). Recarga la página.'); render(); return; }
  S.db = sb;
  sb.auth.onAuthStateChange((ev, ses) => { const a = !!ses; if (a !== S.admin) { S.admin = a; render(); } });
  try { const { data } = await sb.auth.getSession(); S.admin = !!(data && data.session); } catch (e) { }
  render(); startSync();
}
let lastSig = '';
async function pullAll() {
  const [a, b] = await Promise.all([sb.from('slots').select('*'), sb.from('evals').select('*')]);
  if (a.error) throw a.error; if (b.error) throw b.error;
  const slots = {}; (a.data || []).forEach(r => { if (r.sid) slots['j' + r.jurado] = { uid: r.uid, sid: r.sid, name: r.name, at: r.at }; });
  const evals = {}; (b.data || []).forEach(r => { evals[r.id] = r.data; });
  const sig = JSON.stringify([slots, evals]); const changed = sig !== lastSig; lastSig = sig;
  S.slots = slots; S.evals = evals;
  return changed;
}
async function sync(force) {
  try {
    const changed = await pullAll(); banner('');
    if (changed || force || !S.ready) { const k = mySlot(); if (k && !S.dirty && !S.saving) loadDraft(); S.ready = true; render(); }
  } catch (e) { banner('No se pueden leer los datos de Supabase: ' + (e.message || e.code || 'error') + '. Revisa que ejecutaste el script SQL.'); }
}
function startSync() {
  let t; const soon = () => { clearTimeout(t); t = setTimeout(() => sync(), 300); };
  sync(true);
  try { sb.channel('rt').on('postgres_changes', { event: '*', schema: 'public', table: 'slots' }, soon).on('postgres_changes', { event: '*', schema: 'public', table: 'evals' }, soon).subscribe(); } catch (e) { }
  setInterval(() => sync(), 8000);
}

function loadDraft() {
  const k = mySlot(); if (!k) { S.draft = null; return; }
  const e = S.evals[evKey(S.group, k)];
  S.draft = e ? JSON.parse(JSON.stringify(e)) : { day: S.day, group: S.group, jurado: k, pres: {}, trab: {}, obs: {}, general: '' };
  S.draft.pres = S.draft.pres || {}; S.draft.trab = S.draft.trab || {}; S.draft.obs = S.draft.obs || {};
}

/* ---- slots (Jurado 1/2/3) ---- */
async function claim(k) {
  if (!S.name.trim()) { toast('Escribe tu nombre antes de elegir jurado.', true); const n = $('#nm'); n && n.focus(); return; }
  if (mySlot() && mySlot() !== k) { toast('Ya eres Jurado ' + mySlot() + '. Cierra tu sesión primero.', true); return; }
  try {
    const { data, error } = await sb.from('slots').update({ uid: S.uid, sid: S.sid, name: S.name.trim(), at: Date.now() }).eq('jurado', k).is('sid', null).select();
    if (error) throw error;
    if (!data || !data.length) { toast('Jurado ' + k + ' ya fue tomado por otra persona.', true); await sync(true); return; }
    toast('Eres Jurado ' + k + '.'); await pullAll(); S.dirty = false; loadDraft(); render();
  } catch (e) { toast('No se pudo reservar: ' + (e.message || e.code), true); }
}
async function release(k, force) {
  try {
    const { error } = await sb.from('slots').update({ uid: null, sid: null, name: null, at: Date.now() }).eq('jurado', k); if (error) throw error;
    if (!force) { S.draft = null; S.dirty = false; }
    toast(force ? 'Jurado ' + k + ' liberado.' : 'Sesión cerrada. Tu avance quedó guardado.'); await sync(true);
  } catch (e) { toast('No se pudo cerrar la sesión.', true); }
}
async function deleteEvals(scope) {
  S.confirmDel = null;
  const pre = S.day + '_g' + S.fbGroup + '_j';
  const keys = Object.keys(S.evals).filter(k => scope === 'all' || k.startsWith(pre));
  try {
    clearTimeout(touch.t); await new Promise(r => setTimeout(r, 50));
    if (keys.length) {
      const { data, error } = await sb.from('evals').delete().in('id', keys).select(); if (error) throw error;
      if (!data || data.length < keys.length) { toast('No se pudo borrar todo: inicia sesión como administrador.', true); await sync(true); return; }
    }
    S.dirty = false; S.draft = null;
    toast(keys.length ? 'Evaluaciones borradas (' + keys.length + ').' : 'No había evaluaciones para borrar.');
  } catch (e) { toast('No se pudo borrar: ' + (e.message || e.code), true); }
  await sync(true);
}
async function closeAll() {
  S.confirmAll = false;
  try { await flush(); const { error } = await sb.from('slots').update({ uid: null, sid: null, name: null, at: Date.now() }).in('jurado', [1, 2, 3]); if (error) throw error; S.draft = null; S.dirty = false; toast('Sesión cerrada para los 3 jurados. Las evaluaciones siguen guardadas.'); } catch (e) { toast('No se pudo cerrar la sesión.', true); }
  await sync(true);
}
async function backupZip() {
  const keys = Object.keys(S.evals); if (!keys.length) { toast('Todavía no hay evaluaciones guardadas.', true); return; }
  toast('Preparando respaldo…');
  if (!window.JSZip && !(await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']))) { toast('No se pudo cargar el generador de ZIP.', true); return; }
  if (!window.docx && !(await loadScript(['https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'https://unpkg.com/docx@8.5.0/build/index.umd.js']))) { toast('No se pudo cargar Word.', true); return; }
  if (!window.jspdf && !(await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']))) { toast('No se pudo cargar PDF.', true); return; }
  if (!(window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) && !(await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js']))) { toast('No se pudo cargar tablas PDF.', true); return; }
  try {
    const z = new window.JSZip(); const csv = ['sesion,grupo,evaluaciones,calificacion_global_100,nota_5'];
    for (const d of Object.keys(DAYS)) for (let g = 1; g <= NG; g++) {
      const fb = calcFeedback(g, S.evals, d); if (!fb.n) continue;
      const f = z.folder(DAYS[d].replace('é', 'e')); const base = 'Retroalimentacion_Grupo' + g + '_' + DAYS[d].replace('é', 'e');
      f.file(base + '.docx', await window.docx.Packer.toBlob(buildDocx(window.docx, fb, S.logo)));
      f.file(base + '.pdf', buildPdf(window.jspdf, fb, S.logo).output('blob'));
      csv.push([DAYS[d], g, fb.n, fb.global == null ? '' : Math.round(fb.global), fb.global == null ? '' : (fb.global / 20).toFixed(2)].join(','));
    }
    z.file('resumen.csv', '\ufeff' + csv.join('\n'));
    z.file('datos_evaluaciones.json', JSON.stringify(S.evals, null, 1));
    const blob = await z.generateAsync({ type: 'blob' });
    await saveFile('Respaldo_Evaluacion_Entrega3_' + new Date().toISOString().slice(0, 10) + '.zip', blob);
  } catch (e) { toast('Error generando el respaldo: ' + e.message, true); }
}
async function retake(k) {
  try { const { error } = await sb.from('slots').update({ sid: S.sid, name: S.name.trim() || (S.slots['j' + k] || {}).name }).eq('jurado', k).eq('uid', S.uid); if (error) throw error; await pullAll(); loadDraft(); render(); } catch (e) { toast('No se pudo retomar.', true); }
}

/* ---- guardado ---- */
function touch() { S.dirty = true; $('#sv').textContent = 'Guardando…'; clearTimeout(touch.t); touch.t = setTimeout(save, 700); render(true); }
async function save() {
  const k = mySlot(); if (!k || !S.draft || !sb) { $('#sv').textContent = ''; return; }
  if (S.saving) { touch.t = setTimeout(save, 400); return; }
  S.saving = true;
  const d = JSON.parse(JSON.stringify(S.draft)); d.day = S.day; d.group = S.group; d.jurado = k; d.uid = S.uid; d.name = S.name.trim(); d.updatedAt = Date.now();
  try { const { error } = await sb.from('evals').upsert({ id: evKey(S.group, k), data: d, updated_at: new Date().toISOString() }); if (error) throw error; S.evals[evKey(S.group, k)] = d; S.dirty = false; const sv = $('#sv'); if (sv) sv.textContent = 'Guardado ✓'; }
  catch (e) { const sv = $('#sv'); if (sv) sv.textContent = 'No se pudo guardar'; toast('No se pudo guardar: ' + (e.message || e.code), true); }
  S.saving = false;
}
async function flush() { clearTimeout(touch.t); if (S.dirty) await save(); }

async function loadScript(urls) { for (const u of urls) { try { await new Promise((ok, no) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); return true; } catch (e) { } } return false; }
async function saveFile(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const fname = (fb, ext) => 'Retroalimentacion_Grupo' + fb.group + '_' + fb.dayName.replace('é', 'e') + '.' + ext;
async function exportWord() {
  const fb = calcFeedback(S.fbGroup, S.evals, S.day);
  if (!window.docx && !(await loadScript(['https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'https://unpkg.com/docx@8.5.0/build/index.umd.js']))) { toast('No se pudo cargar el generador de Word.', true); return; }
  try { const blob = await window.docx.Packer.toBlob(buildDocx(window.docx, fb, S.logo)); await saveFile(fname(fb, 'docx'), blob); } catch (e) { toast('Error generando Word: ' + e.message, true); }
}
async function exportPdf() {
  const fb = calcFeedback(S.fbGroup, S.evals, S.day);
  if (!window.jspdf && !(await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']))) { toast('No se pudo cargar el generador de PDF.', true); return; }
  if (!(window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) && !(await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js']))) { toast('No se pudo cargar el generador de tablas.', true); return; }
  try { const doc = buildPdf(window.jspdf, fb, S.logo); await saveFile(fname(fb, 'pdf'), doc.output('blob')); } catch (e) { toast('Error generando PDF: ' + e.message, true); }
}

/* ---- render ---- */
const answered = (e) => e ? Object.keys(e.pres || {}).length + Object.keys(e.trab || {}).length : 0;
const TOTAL = () => RUBRIC.pres.length + RUBRIC.trab.length;

const isAdminView = () => S.admin && location.hash !== '#jurado';
function setView(v) { try { location.hash = v === 'jurado' ? 'jurado' : 'admin'; } catch (e) { } render(); }
window.addEventListener('hashchange', () => render());
function renderAdminBar() {
  if (!S.admin) return `<div class="admlink">${S.showLogin ? `<form id="alogin" class="alogin"><input id="ae" type="email" placeholder="Correo de administrador" autocomplete="username"><input id="ap" type="password" placeholder="Clave" autocomplete="current-password"><button class="btn p" type="submit">Entrar</button><button class="btn" type="button" id="alcancel">Cancelar</button></form>` : '<button class="linkbtn" id="alopen">Acceso administrador</button>'}</div>`;
  const a = isAdminView();
  return `<div class="abar"><span>Vista:</span><button class="tab ${a ? 'on' : ''}" data-view="admin">Administrador</button><button class="tab ${a ? '' : 'on'}" data-view="jurado">Jurado</button><button class="btn ghost" id="alout">Salir de administrador</button><span class="hint">${a ? 'Ves todo: jurados, evaluación, resumen y retroalimentación.' : 'Así lo ven los jurados: solo sesión y evaluación.'}</span></div>`;
}
function renderOverview() {
  const rows = Array.from({ length: NG }, (_, i) => {
    const g = i + 1, fb = calcFeedback(g, S.evals, S.day);
    const cells = [1, 2, 3].map(k => { const n = answered(S.evals[evKey(g, k)]); return `<td class="${n >= TOTAL() ? 'ok' : n ? 'part' : ''}">${n ? n + '/' + TOTAL() : '—'}</td>`; }).join('');
    return `<tr data-fbrow="${g}"><th>Grupo ${g}</th>${cells}<td><b>${fb.global == null ? '—' : Math.round(fb.global) + ' / 100'}</b></td></tr>`;
  }).join('');
  return `<section class="card"><h2>Resumen de evaluaciones (administrador) · ${DAYS[S.day]}</h2>${dayChips()}<table class="ov"><thead><tr><th></th><th>Jurado 1</th><th>Jurado 2</th><th>Jurado 3</th><th>Global</th></tr></thead><tbody>${rows}</tbody></table><div class="row" style="margin-top:12px"><button class="btn p" id="zipbtn">Descargar respaldo (ZIP)</button><span class="grow"></span>${S.confirmAll ? '<span class="hint">¿Cerrar la sesión de los 3 jurados? Las evaluaciones no se borran.</span><button class="btn p" id="closeyes">Sí, cerrar</button><button class="btn" id="closeno">Cancelar</button>' : '<button class="btn" id="closeall">Cerrar sesión de todos los jurados</button>'}</div><p class="hint">Criterios calificados por cada jurado (de ${TOTAL()}). Toca una fila para abrir la retroalimentación de ese grupo.</p></section>`;
}
function renderHeader() {
  return `<header class="top">${S.logo ? `<img src="${S.logo}" alt="Escudo Universidad de La Sabana">` : '<div class="nologo">Escudo<br>pendiente</div>'}<div><div class="h1">Evaluación Entrega 3</div><div class="h2">Facultad de Ingeniería - Universidad de La Sabana</div><div class="h3">Experiencia Centrada en el Diseño, profesor: Yosimar Díaz Monterroza</div></div></header>`;
}
function renderSession() {
  const me = mySlot();
  const cards = [1, 2, 3].map(k => {
    const s = S.slots['j' + k]; const taken = s && s.uid; const mine = me === k;
    const sameUser = taken && s.uid === S.uid && s.sid !== S.sid;
    let st, btn = '';
    if (!taken) { st = '<span class="pill free">Libre</span>'; btn = `<button class="btn p" data-claim="${k}" ${me ? 'disabled' : ''}>Ser Jurado ${k}</button>`; }
    else if (mine) { st = '<span class="pill mine">Eres tú</span>'; btn = `<button class="btn" data-release="${k}">Cerrar sesión</button>`; }
    else { st = `<span class="pill busy">Ocupado · ${esc(s.name || 'otro jurado')}</span>`; btn = sameUser ? `<button class="btn" data-retake="${k}">Retomar (mi cuenta)</button>` : `<button class="btn" disabled>No disponible</button>`; if (S.admin) btn += ` <button class="btn ghost" data-force="${k}">Forzar liberación</button>`; }
    return `<div class="slot ${taken ? (mine ? 'mine' : 'taken') : ''}"><div class="sn">Jurado ${k}</div>${st}<div class="sb">${btn}</div></div>`;
  }).join('');
  return `<section class="card"><h2>1 · Sesión de jurado</h2>
  <label class="lbl">Tu nombre<input id="nm" value="${esc(S.name)}" placeholder="Nombre y apellido" ${me ? 'disabled' : ''}></label>
  <div class="slots">${cards}</div>
  <p class="hint">Cuando eliges un jurado queda reservado para ti y se bloquea para los demás en todos los dispositivos. Tu avance se guarda automáticamente; si cierras y vuelves con el mismo navegador, sigues siendo ese jurado.</p></section>`;
}

function renderEval() {
  const me = mySlot();
  if (!me) return `<section class="card muted-card"><h2>2 · Evaluación</h2><p class="hint">Elige tu puesto de jurado arriba para empezar a evaluar.</p></section>`;
  if (!S.draft) loadDraft();
  const chips = Array.from({ length: NG }, (_, i) => { const g = i + 1, n = answered(S.evals[evKey(g, me)]); return `<button class="chip ${S.group === g ? 'on' : ''} ${n ? 'done' : ''}" data-grp="${g}" title="${n ? n + '/' + TOTAL() + ' criterios' : 'Sin calificar'}">${g}${n >= TOTAL() ? ' ✓' : n ? ' •' : ''}</button>`; }).join('');
  const grp = `${dayChips()}<div class="lbl">Grupo a evaluar (1–${NG})</div><div class="chips">${chips}</div><div class="row">
    <div class="tabs">${['pres', 'trab'].map(t => `<button class="tab ${S.tab === t ? 'on' : ''}" data-tab="${t}">${t === 'pres' ? 'Presentación' : 'Trabajo escrito'}</button>`).join('')}</div>
    <span id="sv" class="sv"></span></div>`;
  const key = S.tab, pk = key[0];
  let tot = 0, wr = 0;
  const rows = RUBRIC[key].map((c, i) => {
    const v = Number(S.draft[key][i]) || 0;
    if (v) { tot += v / 4 * c.w; wr += c.w; }
    const opts = [4, 3, 2, 1].map((n, j) => `<label class="lv ${v === n ? 'sel' : ''} n${n}"><input type="radio" name="${key}${i}" value="${n}" ${v === n ? 'checked' : ''} data-k="${key}" data-i="${i}"><b>Nivel ${n}</b><span>${esc(c.l[j])}</span></label>`).join('');
    return `<div class="crit"><div class="ch"><h3>${i + 1}. ${esc(c.t)}</h3><span class="w">${c.w}%</span></div><div class="lvs">${opts}</div>
    <textarea data-obs="${pk}${i}" rows="2" placeholder="Observaciones para el grupo (opcional)">${esc(S.draft.obs[pk + i] || '')}</textarea></div>`;
  }).join('');
  const score = wr ? Math.round(tot * 100 / wr) : 0;
  return `<section class="card"><h2>2 · Evaluación <span class="who">Jurado ${me} · ${esc(S.name)}</span></h2>${grp}
  <div class="score">Tu calificación en esta rúbrica: <b>${wr ? score + ' / 100' : '—'}</b> <span class="muted">· ${Object.keys(S.draft[key]).length}/${RUBRIC[key].length} criterios calificados</span></div>
  ${rows}
  <label class="lbl">Comentario general (opcional)<textarea id="gen" rows="3" placeholder="Comentario general para el grupo">${esc(S.draft.general || '')}</textarea></label></section>`;
}

function renderFeedback() {
  const g = S.fbGroup;
  const fb = calcFeedback(g, S.evals, S.day);
  const status = [1, 2, 3].map(k => { const e = S.evals[evKey(g, k)]; const n = answered(e); return `<span class="pill ${n ? 'mine' : 'free'}">Jurado ${k}: ${n}/${TOTAL()}</span>`; }).join(' ');
  const logoBox = `<details class="logo"><summary>Escudo de la Universidad ${S.logo ? '· cargado ✓' : '· pendiente'}</summary>
    <p class="hint">Ya está cargado el escudo azul de la Universidad. Si quieres cambiarlo, sube otra imagen (PNG/JPG con fondo blanco o transparente).</p>
    <input type="file" id="logoFile" accept="image/*"> <label class="chk"><input type="checkbox" id="recolor" ${S.recolor ? 'checked' : ''}> Recolorear a azul</label>
    ${S.logo ? `<div class="lp"><img src="${S.logo}" alt="escudo"></div>` : ''}</details>`;
  return `<section class="card"><h2>3 · Retroalimentación</h2>${dayChips()}
  <div class="lbl">Grupo (1–${NG})</div><div class="chips">${Array.from({ length: NG }, (_, i) => { const x = i + 1, c = calcFeedback(x, S.evals, S.day).n; return `<button class="chip ${g === x ? 'on' : ''} ${c ? 'done' : ''}" data-fbg="${x}" title="${c} evaluación(es)">${x}${c ? ' · ' + c : ''}</button>`; }).join('')}</div>
  <div class="row">${status}
  <span class="grow"></span><button class="btn p" id="dlw" ${fb.n ? '' : 'disabled'}>Descargar Word</button><button class="btn p" id="dlp" ${fb.n ? '' : 'disabled'}>Descargar PDF</button></div>
  <div class="row danger">${S.confirmDel ? `<span class="hint">${S.confirmDel === 'all' ? '¿Borrar TODAS las evaluaciones de Miércoles y Viernes?' : '¿Borrar las evaluaciones del Grupo ' + g + ' – ' + DAYS[S.day] + '?'} No se puede deshacer.</span><button class="btn dng" id="delyes">Sí, borrar</button><button class="btn" id="delno">Cancelar</button>` : `<button class="btn dng-o" id="delgrp" ${fb.n ? '' : 'disabled'}>Borrar evaluación de este grupo</button><button class="btn dng-o" id="delall">Borrar todas las evaluaciones</button>`}</div>
    <div class="stage">${previewHTML(fb, S.logo)}</div></section>`;
}

function render(light) {
  if (light) { // solo refrescar puntaje sin perder foco
    const sc = document.querySelector('.score'); if (sc && S.draft) { const key = S.tab; let t = 0, w = 0; RUBRIC[key].forEach((c, i) => { const v = Number(S.draft[key][i]) || 0; if (v) { t += v / 4 * c.w; w += c.w; } }); sc.innerHTML = `Tu calificación en esta rúbrica: <b>${w ? Math.round(t * 100 / w) + ' / 100' : '—'}</b> <span class="muted">· ${Object.keys(S.draft[key]).length}/${RUBRIC[key].length} criterios calificados</span>`; }
    return;
  }
  const a = document.activeElement; const typing = a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && ['text', 'email', 'password'].includes(a.type)));
  if (typing) { // no destruir lo que se está escribiendo; refrescar solo sesión y vista previa
    return;
  }
  const y = window.scrollY;
  $('#app').innerHTML = renderHeader() + renderAdminBar() + renderSession() + renderEval() + (isAdminView() ? renderOverview() + renderFeedback() : '');
  window.scrollTo(0, y);
  bind();
}

function bind() {
  const ao = $('#alopen'); if (ao) ao.onclick = () => { S.showLogin = true; render(); };
  const ac = $('#alcancel'); if (ac) ac.onclick = () => { S.showLogin = false; render(); };
  const al = $('#alogin'); if (al) al.onsubmit = async ev => { ev.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: $('#ae').value.trim(), password: $('#ap').value }); if (error) { toast('Correo o clave incorrectos.', true); return; } S.showLogin = false; S.admin = true; location.hash = 'admin'; render(); };
  const ax = $('#alout'); if (ax) ax.onclick = async () => { await sb.auth.signOut(); S.admin = false; render(); };
  const dg = $('#delgrp'); if (dg) dg.onclick = () => { S.confirmDel = 'group'; render(); };
  const da = $('#delall'); if (da) da.onclick = () => { S.confirmDel = 'all'; render(); };
  const dy = $('#delyes'); if (dy) dy.onclick = () => deleteEvals(S.confirmDel);
  const dn = $('#delno'); if (dn) dn.onclick = () => { S.confirmDel = null; render(); };
  const zb = $('#zipbtn'); if (zb) zb.onclick = backupZip;
  const ca = $('#closeall'); if (ca) ca.onclick = () => { S.confirmAll = true; render(); };
  const cy = $('#closeyes'); if (cy) cy.onclick = closeAll;
  const cn = $('#closeno'); if (cn) cn.onclick = () => { S.confirmAll = false; render(); };
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = async () => { await flush(); S.day = b.dataset.day; S.dirty = false; loadDraft(); render(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
  document.querySelectorAll('[data-fbrow]').forEach(r => r.onclick = () => { S.fbGroup = +r.dataset.fbrow; render(); setTimeout(() => { const f = document.querySelector('.stage'); f && f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); });
  const nm = $('#nm'); if (nm) nm.oninput = () => { S.name = nm.value; lsSet('jname', S.name); };
  document.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => claim(+b.dataset.claim));
  document.querySelectorAll('[data-release]').forEach(b => b.onclick = async () => { await flush(); release(+b.dataset.release); });
  document.querySelectorAll('[data-force]').forEach(b => b.onclick = () => release(+b.dataset.force, true));
  document.querySelectorAll('[data-retake]').forEach(b => b.onclick = () => retake(+b.dataset.retake));
  document.querySelectorAll('[data-grp]').forEach(b => b.onclick = async () => { await flush(); S.group = +b.dataset.grp; S.fbGroup = S.group; S.dirty = false; loadDraft(); render(); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  document.querySelectorAll('input[type=radio][data-k]').forEach(r => r.onchange = () => { S.draft[r.dataset.k][r.dataset.i] = +r.value; touch(); r.closest('.lvs').querySelectorAll('.lv').forEach(l => l.classList.remove('sel')); r.closest('.lv').classList.add('sel'); });
  document.querySelectorAll('textarea[data-obs]').forEach(t => t.oninput = () => { S.draft.obs[t.dataset.obs] = t.value; touch(); });
  const gen = $('#gen'); if (gen) gen.oninput = () => { S.draft.general = gen.value; touch(); };
  document.querySelectorAll('[data-fbg]').forEach(b => b.onclick = () => { S.fbGroup = +b.dataset.fbg; render(); });
  const w = $('#dlw'); if (w) w.onclick = exportWord; const p = $('#dlp'); if (p) p.onclick = exportPdf;
}
window.addEventListener('blur', () => { flush(); });
init();
</script>
</body></html>
